<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GreenThumb Nursery offers organic plants, seeds, and helpful gardening advice.">
  <title>GreenThumb Nursery - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="GreenThumb Nursery leaf logo"><span>GreenThumb Nursery</span></a>
    <nav aria-label="Main navigation"><ul><li><a href="index.html">Home</a></li><li><a href="products.html">Products</a></li><li><a href="about.html">About Us</a></li><li><a href="contact.html" aria-current="page">Contact Us</a></li></ul></nav>
  </div></header>
  <main>
<section><h1>Contact GreenThumb Nursery</h1><h2>Get in Touch</h2><p class="intro">Have questions about plant care or inventory? Send us a message below.</p>
<form id="contact-form" action="#" method="post" novalidate>
<fieldset><legend>Personal Information</legend>
<div class="form-field"><label for="fullname">Full Name:</label><input type="text" id="fullname" name="fullname" autocomplete="name" required><span class="field-error" id="fullname-error" aria-live="polite"></span></div>
<div class="form-field"><label for="email">Email Address:</label><input type="email" id="email" name="email" autocomplete="email" required><span class="field-error" id="email-error" aria-live="polite"></span></div>
<div class="form-field"><label for="phone">Phone Number (Format: 123-456-7890):</label><input type="tel" id="phone" name="phone" autocomplete="tel" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"><span class="field-error" id="phone-error" aria-live="polite"></span></div>
</fieldset>
<fieldset><legend>Your Inquiry</legend>
<div class="form-field"><label for="topic">Inquiry Type:</label><select id="topic" name="topic" required><option value="">-- Please select an option --</option><option value="plant-care">Plant Care Advice</option><option value="inventory">Inventory Availability</option><option value="events">Workshops &amp; Events</option></select><span class="field-error" id="topic-error" aria-live="polite"></span></div>
<div class="form-field"><label for="message">Message:</label><textarea id="message" name="message" rows="5" minlength="10" required></textarea><span class="field-error" id="message-error" aria-live="polite"></span></div>
</fieldset><button type="submit">Submit Message</button><p id="form-status" role="status" aria-live="polite"></p>
</form></section>
</main>
  <footer><p>&copy; 2026 GreenThumb Nursery. All rights reserved.</p></footer>
<script src="script.js" defer></script>
</body>
</html>
